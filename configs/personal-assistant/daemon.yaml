# Master daemon config for the personal-assistant preset.
# Wires up bundled local MCP servers and macOS app automation. The daemon
# also reads the other policy files from this same directory.
#
# Use:
#   capdep daemon start --config configs/personal-assistant/daemon.yaml
#
# The daemon's policy loader walks the parent directory of this file
# looking for: profiles.yaml, purposes.yaml, source_bindings.yaml,
# envelopes.yaml, override_policy.yaml, approval-patterns.yaml. Drop
# them next to this file to be picked up.

# Production decision-refinement layer. These Starlark scripts are
# tightening-only defaults: they add approval friction for sensitive egress,
# active local app automation, and runaway repeated actions, but do not relax
# any base policy decision.
decision_inspectors:
  - script: ../policies/sensitive_egress_confirm.star
    runtime: starlark
    failure_mode: require_approval
  - script: ../policies/local_app_confirm.star
    runtime: starlark
    failure_mode: require_approval
  - script: ../policies/frequency_cap.star
    runtime: starlark
    failure_mode: require_approval
  - script: ../policies/onguard_declared_workflows.star
    runtime: starlark
    failure_mode: require_approval
  - script: ../policies/onguard_sensitive_publish_confirm.star
    runtime: starlark
    failure_mode: require_approval
  - script: ../policies/onguard_low_integrity_suggestions.star
    runtime: starlark
    failure_mode: require_approval

upstream_servers:
  # ---------------- bundled Python servers ----------------
  # No Node.js / npm required. Pure Python, ships with capdep.

  - name: bundled-fs
    command: ["capdep", "mcp-server-fs"]
    inherent_labels: []
    tool_overrides:
      "fs.read":
        capability_kind: READ_FS
        target_arg: path
      "fs.list":
        capability_kind: READ_FS
        target_arg: path
      "fs.create":
        capability_kind: CREATE_FS
        target_arg: path
      "fs.write":
        capability_kind: WRITE_FS
        target_arg: path
      "fs.delete":
        capability_kind: DELETE_FS
        target_arg: path

  - name: bundled-fetch
    command: ["capdep", "mcp-server-fetch"]
    inherent_labels: ["untrusted.external"]
    tool_overrides:
      "fetch.get":
        capability_kind: WEB_FETCH
        target_arg: url

  - name: bundled-search
    command: ["capdep", "mcp-server-search"]
    inherent_labels: ["untrusted.external"]
    tool_overrides:
      "search.web":
        capability_kind: WEB_FETCH
        target_arg: query

  # Kagi — full web/news search. Store KAGI_API_KEY in the CapDep
  # credential vault for server `kagi` or export it before daemon start.
  # The daemon resolves `uvx` through the repo `.venv/bin` in local dev.
  # Prefer kagi_search_fetch for headlines; bundled-search uses Brave
  # (if keyed) or DuckDuckGo Instant Answer as fallback.
  - name: kagi
    command: ["uvx", "kagimcp"]
    env:
      KAGI_API_KEY: "${KAGI_API_KEY}"
    strict: true
    inherent_labels: ["untrusted.external"]
    tool_overrides:
      kagi_search_fetch:
        capability_kind: WEB_FETCH
        target_arg: query
      kagi_extract:
        capability_kind: WEB_FETCH

  - name: bundled-memory
    command: ["capdep", "mcp-server-memory"]
    inherent_labels: []
    tool_overrides:
      "memory.create":
        capability_kind: MEMORY_CREATE
        target_arg: key
      "memory.read":
        capability_kind: MEMORY_READ
        target_arg: key
      "memory.update":
        capability_kind: MEMORY_MODIFY
        target_arg: key
      "memory.delete":
        capability_kind: MEMORY_DELETE
        target_arg: key
      "memory.list":
        capability_kind: MEMORY_READ
        target_arg: prefix

  - name: bundled-git
    command: ["capdep", "mcp-server-git"]
    inherent_labels: []
    tool_overrides:
      "git.status":
        capability_kind: READ_FS
        target_arg: repo_path
      "git.log":
        capability_kind: READ_FS
        target_arg: repo_path
      "git.diff":
        capability_kind: READ_FS
        target_arg: repo_path
      "git.show":
        capability_kind: READ_FS
        target_arg: repo_path
      "git.branch_list":
        capability_kind: READ_FS
        target_arg: repo_path

  # ---------------- macOS / Apple apps ----------------
  # Bounded AppleScript-backed servers. They do not expose generic
  # AppleScript execution; each tool maps to a granular capability kind.

  - name: bundled-apple-mail
    command: ["capdep", "mcp-server-apple-mail"]
    inherent_labels: ["confidential.personal", "untrusted.user_input"]
    tool_overrides:
      "apple_mail.list_accounts":
        capability_kind: APPLE_MAIL_READ
        target_template: "applemail://accounts"
      "apple_mail.list_mailboxes":
        capability_kind: APPLE_MAIL_READ
        target_template: "applemail://mailboxes"
      "apple_mail.search_messages":
        capability_kind: APPLE_MAIL_READ
        target_template: "applemail://mailbox/{mailbox_name}"
      "apple_mail.get_message":
        capability_kind: APPLE_MAIL_READ
        target_template: "applemail://mailbox/{mailbox_name}/message/{message_id}"
      "apple_mail.create_draft":
        capability_kind: APPLE_MAIL_DRAFT
        target_arg: to

  - name: bundled-keynote
    command: ["capdep", "mcp-server-keynote"]
    inherent_labels: ["confidential.personal"]
    tool_overrides:
      "keynote.frontmost_document":
        capability_kind: KEYNOTE_READ
        target_template: "keynote://frontmost"
      "keynote.list_slides":
        capability_kind: KEYNOTE_READ
        target_template: "keynote://frontmost"
      "keynote.slide_text":
        capability_kind: KEYNOTE_READ
        target_template: "keynote://frontmost"
      "keynote.start_slideshow":
        capability_kind: KEYNOTE_PRESENT
        target_template: "keynote://frontmost"
      "keynote.stop_slideshow":
        capability_kind: KEYNOTE_PRESENT
        target_template: "keynote://frontmost"

  - name: bundled-pages
    command: ["capdep", "mcp-server-pages"]
    inherent_labels: ["confidential.personal"]
    tool_overrides:
      "pages.frontmost_document":
        capability_kind: PAGES_READ
        target_template: "pages://frontmost"
      "pages.document_text":
        capability_kind: PAGES_READ
        target_template: "pages://frontmost"
      "pages.append_text":
        capability_kind: PAGES_EDIT
        target_template: "pages://frontmost"
      "pages.export_pdf":
        capability_kind: PAGES_EXPORT
        target_arg: path

  - name: bundled-numbers
    command: ["capdep", "mcp-server-numbers"]
    inherent_labels: ["confidential.personal"]
    tool_overrides:
      "numbers.frontmost_document":
        capability_kind: NUMBERS_READ
        target_template: "numbers://frontmost"
      "numbers.list_sheets":
        capability_kind: NUMBERS_READ
        target_template: "numbers://frontmost"
      "numbers.table_summary":
        capability_kind: NUMBERS_READ
        target_template: "numbers://frontmost"
      "numbers.get_cell_value":
        capability_kind: NUMBERS_READ
        target_template: "numbers://frontmost"
      "numbers.set_cell_value":
        capability_kind: NUMBERS_EDIT
        target_template: "numbers://frontmost"
      "numbers.export_pdf":
        capability_kind: NUMBERS_EXPORT
        target_arg: path

  - name: bundled-macos
    command: ["capdep", "mcp-server-macos"]
    inherent_labels: ["confidential.personal"]
    tool_overrides:
      "macos.frontmost_application":
        capability_kind: MACOS_APP_CONTROL
        target_template: "macos://apps"
      "macos.list_running_applications":
        capability_kind: MACOS_APP_CONTROL
        target_template: "macos://apps"
      "macos.open_application":
        capability_kind: MACOS_APP_CONTROL
        target_template: "macos://app/{bundle_id}"
      "macos.get_clipboard_text":
        capability_kind: MACOS_CLIPBOARD_READ
        target_template: "macos://clipboard"
      "macos.set_clipboard_text":
        capability_kind: MACOS_CLIPBOARD_WRITE
        target_template: "macos://clipboard"
      "macos.show_notification":
        capability_kind: MACOS_NOTIFICATION
        target_template: "macos://notification"

  # ---------------- Microsoft Office apps ----------------
  # Same bounded AppleScript substrate as the Apple app servers. These
  # are draft/read/edit/export/present actions only; no macros, VBA, or
  # generic script execution is exposed.

  - name: bundled-outlook
    command: ["capdep", "mcp-server-outlook"]
    inherent_labels: ["confidential.personal", "untrusted.user_input"]
    tool_overrides:
      "outlook.list_accounts":
        capability_kind: OUTLOOK_READ
        target_template: "outlook://accounts"
      "outlook.create_draft":
        capability_kind: OUTLOOK_DRAFT
        target_arg: to

  - name: bundled-word
    command: ["capdep", "mcp-server-word"]
    inherent_labels: ["confidential.personal"]
    tool_overrides:
      "word.frontmost_document":
        capability_kind: WORD_READ
        target_template: "word://frontmost"
      "word.document_text":
        capability_kind: WORD_READ
        target_template: "word://frontmost"
      "word.append_text":
        capability_kind: WORD_EDIT
        target_template: "word://frontmost"
      "word.export_pdf":
        capability_kind: WORD_EXPORT
        target_arg: path

  - name: bundled-powerpoint
    command: ["capdep", "mcp-server-powerpoint"]
    inherent_labels: ["confidential.personal"]
    tool_overrides:
      "powerpoint.frontmost_presentation":
        capability_kind: POWERPOINT_READ
        target_template: "powerpoint://frontmost"
      "powerpoint.list_slides":
        capability_kind: POWERPOINT_READ
        target_template: "powerpoint://frontmost"
      "powerpoint.append_speaker_notes":
        capability_kind: POWERPOINT_EDIT
        target_template: "powerpoint://frontmost"
      "powerpoint.start_slideshow":
        capability_kind: POWERPOINT_PRESENT
        target_template: "powerpoint://frontmost"
      "powerpoint.export_pdf":
        capability_kind: POWERPOINT_EXPORT
        target_arg: path
